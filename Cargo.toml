[workspace]
resolver = "2"
members = [
  "crates/encre-css",
  "crates/encre-css-cli",
  "crates/encre-css-typography",
  "crates/encre-css-icons",
]

[workspace.package]
readme = "README.md"

[workspace.dependencies]
toml = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
log = "0.4.27"
