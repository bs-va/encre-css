image: rust:latest

stages:
  - check
  - deploy

check:test:
  stage: check
  script:
    - cargo test --workspace

pages:
  stage: deploy
  script:
    - cargo doc --release --no-deps
    - rm -rf public
    - mkdir public
    - cp -r target/doc/* public
  artifacts:
    paths:
      - public
  when: manual
