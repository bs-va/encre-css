image: rust:latest

cache:
  key: shared-cache
  paths:
    - target/
    - cargo/

variables:
  CARGO_HOME: $CI_PROJECT_DIR/cargo

check:test:
  stage: test
  script:
    - rustc --version && cargo --version
    - cargo test --workspace

pages:
  stage: deploy
  script:
    - cargo doc --release --no-deps --workspace --exclude encre-css-cli
    - rm -rf public
    - mkdir public
    - cp -r target/doc/* public
  artifacts:
    paths:
      - public
  when: manual
