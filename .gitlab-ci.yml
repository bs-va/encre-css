image: rust:latest

cache:
  key: shared-cache
  paths:
      - target/

check:test:
  stage: test
  script:
    - cargo test --workspace

pages:
  stage: deploy
  script:
    - cargo doc --release --no-deps
    - rm -rf public
    - mkdir public
    - cp -r target/doc/* public
  artifacts:
    paths:
      - public
  when: manual
