[package]
name = "encre-css-cli"
version = "0.16.0"
description = "A TailwindCSS-compatible utility-first CSS generation library written in Rust"
authors = ["nifou <nifou@mailfence.com>"]
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
readme.workspace = true
keywords = ["tailwind", "css", "compiler", "cli"]
categories = ["web-programming", "command-line-utilities"]

[[bin]]
name = "encrecss"
path = "src/main.rs"

[dependencies]
encre-css = { path = "../encre-css", version = "0.16.0" }
clap = { version = "4.0.18", features = ["derive"] }
notify-debouncer-mini = "0.6.0"
rand = "0.9.1"
wax = "0.6.0"
color-eyre = "0.6.5"
toml = "0.8.23"
serde = { version = "1.0.219", features = ["derive"] }
