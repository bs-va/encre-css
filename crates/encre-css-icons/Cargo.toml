[package]
name = "encre-css-icons"
version = "0.1.0"
description = "Quickly add pure CSS icons to your website"
authors = ["nifou <nifou@mailfence.com>"]
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
documentation = "https://docs.rs/encre-css-icons"
keywords = ["tailwind", "css", "compiler", "encre-css"]
categories = ["web-programming"]

[dependencies]
directories = "5.0.0"
encre-css = { path = "../encre-css" }
once_cell = "1.14.0"
reqwest = { version = "0.11.11", features = ["json", "blocking"] }
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"
