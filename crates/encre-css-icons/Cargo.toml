[package]
name = "encre-css-icons"
version = "0.1.7"
description = "Quickly add pure CSS icons to your website"
authors = ["nifou <nifou@mailfence.com>"]
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
documentation = "https://docs.rs/encre-css-icons"
keywords = ["tailwind", "css", "compiler", "encre-css"]
categories = ["web-programming"]

[dependencies]
encre-css = { path = "../encre-css", version = "0.14.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { version = "5.0.0", optional = true }
once_cell = "1.14.0"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"
ureq = "2.7.1"
include_dir = { version = "0.7.4", optional = true }

[features]
default = ["fs-cache"]
fs-cache = ["directories"]
embed-icons = ["include_dir"]
