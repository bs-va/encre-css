[package]
name = "encre-css"
version = "0.17.1"
description = "A TailwindCSS-compatible utility-first CSS generation library written in Rust"
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
documentation = "https://docs.rs/encre-css"
readme.workspace = true
keywords = ["tailwind", "css", "compiler"]
categories = ["web-programming"]

[[bench]]
name = "benchmark"
harness = false

[dependencies]
toml = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
phf = { version = "0.12.1", features = ["macros"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = { version = "0.6.0", features = ["html_reports"] }
