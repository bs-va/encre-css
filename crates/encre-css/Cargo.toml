[package]
name = "encre-css"
version = "0.1.0"
description = "A TailwindCSS-compatible CSS generation library written in Rust"
authors = ["nifou <nifou@mailfence.com>"]
license = "MIT"
edition = "2021"

[[bench]]
name = "benchmark"
harness = false

[dependencies]
toml = "0.5.9"
serde = { version = "1.0.137", features = ["derive"] }
lazy_static = "1.4.0"
regex = "1.5.5"
rayon = "1.5.2"
wax = "0.5.0"
thiserror = "1.0.31"
smol_str = "0.1.23"

[dev-dependencies]
pretty_assertions = "1.2.1"
criterion = { version = "0.3", features = ["html_reports"] }
