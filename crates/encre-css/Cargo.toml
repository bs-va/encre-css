[package]
name = "encre-css"
version = "0.7.0"
description = "A TailwindCSS-compatible utility-first CSS generation library written in Rust"
authors = ["nifou <nifou@mailfence.com>"]
license = "MIT"
edition = "2021"
repository = "https://gitlab.com/encre-org/encre-css.git"
documentation = "https://encre-org.gitlab.io/encre-css/encre_css"

[[bench]]
name = "benchmark"
harness = false

[dependencies]
toml = "0.5.9"
serde = { version = "1.0.144", features = ["derive"] }
thiserror = "1.0.34"

[dev-dependencies]
pretty_assertions = "1.3.0"
criterion = { version = "0.4.0", features = ["html_reports"] }
